[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-visual-agent"
version = "0.1.0"
description = "Qwen-powered fashion visual agent with image tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "Pillow==13.0.0",
    "nicegui==4.0.0",
    "fastapi==0.162.3",
]

[project.scripts]
fva-brain = "fashion_visual_agent.cli:main"
fva-web = "fashion_visual_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fashion_visual_agent = ["web_assets/*.css", "web_assets/*.png"]
